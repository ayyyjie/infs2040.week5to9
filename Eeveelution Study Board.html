<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Eeveelution Study Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: the party list sits down the left (a scrolling strip on phones) and one zone is open on the right.
   The open zone's type colour tints the paper, panels and accents of the whole page. */
:root{
  --t-normal:#c79a5e; --t-fire:#f2823a; --t-water:#4aa3ec; --t-electric:#f3c623; --t-psychic:#c583e6;
  --t-dark:#7e86cf; --t-grass:#6cbf4b; --t-ice:#6fd0cc; --t-fairy:#f58fb4;
  --acc:var(--t-normal);
  --ink:#1c1a24; --base-paper:#f4f4ef; --base-panel:#ffffff; --shadow:#1c1a24; --edge:#1c1a24; --on-acc:#1c1a24;
  --good:#17753f; --bad:#b8322a; --good-bg:#dff3e6; --bad-bg:#fbe3e0;
  --paper:color-mix(in oklab, var(--acc) 10%, var(--base-paper));
  --panel:color-mix(in oklab, var(--acc) 3%, var(--base-panel));
  --soft:color-mix(in oklab, var(--acc) 24%, var(--base-panel));
  --acc-ink:color-mix(in oklab, var(--acc) 45%, var(--ink));
  --mute:color-mix(in oklab, var(--ink) 68%, var(--base-paper));
  --rule:color-mix(in oklab, var(--ink) 18%, var(--base-paper));
  --f-display:"Pixelify Sans","Courier New",monospace;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-data:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#edebf4; --base-paper:#15141b; --base-panel:#201f29; --shadow:#000000; --edge:#9a97a8;
    --good:#5fd394; --bad:#ff8b7e; --good-bg:#17392a; --bad-bg:#45201d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#edebf4; --base-paper:#15141b; --base-panel:#201f29; --shadow:#000000; --edge:#9a97a8;
  --good:#5fd394; --bad:#ff8b7e; --good-bg:#17392a; --bad-bg:#45201d; color-scheme:dark;
}
:root[data-type="fire"]{--acc:var(--t-fire)} :root[data-type="water"]{--acc:var(--t-water)}
:root[data-type="electric"]{--acc:var(--t-electric)} :root[data-type="psychic"]{--acc:var(--t-psychic)}
:root[data-type="dark"]{--acc:var(--t-dark)} :root[data-type="grass"]{--acc:var(--t-grass)}
:root[data-type="ice"]{--acc:var(--t-ice)} :root[data-type="fairy"]{--acc:var(--t-fairy)}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--f-body);transition:background-color .35s ease}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--acc-ink)}
code{font-family:var(--f-data);font-size:.9em;background:var(--soft);padding:.05em .35em;border-radius:3px}
:focus-visible{outline:3px solid var(--acc-ink);outline-offset:2px}
svg.em{width:1em;height:1em;display:block;flex:none}

.app{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:16px 64px;display:grid;grid-template-columns:232px minmax(0,1fr);gap:32px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 32px);overflow-y:auto;padding:2px 6px 8px 2px}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.1;display:flex;flex-direction:column;gap:2px}
.brand small{font:400 12px/1.3 var(--f-data);color:var(--mute);letter-spacing:.02em}
.party{display:flex;flex-direction:column;gap:4px}
.party .sep{height:1px;background:var(--rule);margin:6px 0}
.pk{display:flex;align-items:center;gap:10px;padding:6px 8px;border:2px solid transparent;border-radius:6px;background:none;text-align:left;width:100%;min-width:0}
.pk:hover{background:var(--panel)}
.pk[aria-current="page"]{background:var(--panel);border-color:var(--edge);box-shadow:3px 3px 0 var(--shadow)}
.pk .tile{width:30px;height:30px;border-radius:5px;background:var(--c,var(--soft));color:var(--on-acc);display:grid;place-items:center;font-size:17px;flex:none;border:1.5px solid var(--edge)}
.pk .nm{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.pk .nm b{font-family:var(--f-display);font-weight:500;font-size:16px}
.pk .nm span{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .got{margin-left:auto;font:500 11px var(--f-data);color:var(--good);flex:none}

main{min-width:0;outline:none}
.eyebrow{font:500 12px/1.3 var(--f-data);letter-spacing:.08em;text-transform:uppercase;color:var(--acc-ink)}
.lead{font-size:18px;line-height:1.55;max-width:62ch}
.note{font-size:14px;color:var(--mute);max-width:66ch}
.stack{display:flex;flex-direction:column;gap:20px}
.stack-lg{display:flex;flex-direction:column;gap:36px}

/* zone header */
.zone-head{display:flex;gap:20px;align-items:flex-start}
.zone-head .tile{width:84px;height:84px;border-radius:8px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-size:48px;flex:none;border:2px solid var(--edge);box-shadow:5px 5px 0 var(--shadow)}
.zone-head .txt{display:flex;flex-direction:column;gap:8px;min-width:0}
.zone-head h1{font-size:clamp(30px,5vw,44px)}
.zone-head h1 span{display:block;font-size:.5em;font-weight:500;color:var(--acc-ink);margin-top:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px}
.meta .chip{white-space:normal;line-height:1.3;border-radius:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--f-data);padding:6px 9px;border-radius:999px;background:var(--soft);color:var(--ink);border:1px solid transparent;white-space:nowrap}
.chip.line{background:none;border-color:var(--rule);color:var(--mute)}
button.chip{border-color:var(--rule);background:var(--panel)}
button.chip[aria-pressed="true"]{background:var(--acc);color:var(--on-acc);border-color:var(--edge)}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.tab{flex:none;font-family:var(--f-display);font-weight:500;font-size:16px;padding:8px 14px;border:2px solid var(--edge);border-radius:6px;background:var(--panel)}
.tab[aria-selected="true"]{background:var(--acc);color:var(--on-acc);box-shadow:3px 3px 0 var(--shadow)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:500;font-size:16px;padding:9px 16px;border:2px solid var(--edge);border-radius:6px;background:var(--acc);color:var(--on-acc);box-shadow:3px 3px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn.sm{font-size:14px;padding:6px 11px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* concept cards */
.concept{border:1.5px solid var(--rule);border-radius:8px;background:var(--panel);overflow:hidden}
.concept>h3{font-size:21px;padding:16px 18px 12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tag{font:500 11px/1 var(--f-data);letter-spacing:.06em;text-transform:uppercase;padding:5px 7px;border-radius:4px;background:var(--ink);color:var(--base-panel)}
.says{background:var(--soft);padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.lbl{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--f-data);letter-spacing:.08em;text-transform:uppercase;color:var(--acc-ink)}
.says p{max-width:66ch}
.real{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px}
.real p,.real li{max-width:68ch}
.real ul,.real ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:5px}
.formula{font-family:var(--f-data);font-weight:500;font-size:15px;background:var(--paper);border:1.5px dashed var(--acc-ink);border-radius:6px;padding:9px 12px;width:fit-content;max-width:100%}
.scroll{overflow-x:auto;max-width:100%}
.tbl{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:100%}
.tbl th,.tbl td{border-bottom:1px solid var(--rule);padding:7px 10px;text-align:left;vertical-align:top}
.tbl th{font:500 11px/1.3 var(--f-data);letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.tbl tr.total td{font-weight:700;border-top:2px solid var(--edge);border-bottom:none}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--f-data)}

/* lists */
.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ticks label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--rule);border-radius:8px;background:var(--panel);cursor:pointer}
.ticks input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--acc-ink);flex:none}
.ticks label:has(input:checked){background:var(--soft);border-color:var(--acc-ink)}
.plain{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;max-width:70ch}
.h2{font-size:26px}
.h3{font-size:20px}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.box{border:1.5px solid var(--rule);border-radius:8px;background:var(--panel);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box.weak{border-style:dashed}

details.qa{border:1.5px solid var(--rule);border-radius:8px;background:var(--panel)}
details.qa summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary .q{flex:1;min-width:0;font-weight:700}
details.qa summary .mk{font:500 12px/1 var(--f-data);padding:6px 8px;border-radius:4px;background:var(--soft);white-space:nowrap;flex:none}
details.qa summary::after{content:"+";font:700 20px/1 var(--f-display);color:var(--acc-ink);flex:none}
details.qa[open] summary::after{content:"-"}
details.qa .a{padding:0 16px 16px;display:flex;flex-direction:column;gap:6px;max-width:74ch}

/* labs and quiz */
.lab{border:2px solid var(--edge);border-radius:8px;background:var(--panel);box-shadow:5px 5px 0 var(--shadow);min-width:0}
.lab>header{padding:14px 18px;border-bottom:2px solid var(--edge);background:var(--soft);border-radius:6px 6px 0 0;display:flex;flex-direction:column;gap:4px}
.lab>header h3{font-size:21px}
.lab>.body{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.opt{display:block;width:100%;text-align:left;padding:11px 14px;border:2px solid var(--edge);border-radius:6px;background:var(--panel);line-height:1.4}
.opt:hover:not([disabled]){background:var(--soft)}
.opt[disabled]{cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:8px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.cats .opt{text-align:center;font-weight:700;font-size:15px}
.prompt{font-size:18px;font-weight:700;line-height:1.4;max-width:60ch}
.fb{padding:10px 14px;border-radius:6px;font-size:15px}
.fb.ok{background:var(--good-bg);color:var(--ink);border:1.5px solid var(--good)}
.fb.no{background:var(--bad-bg);color:var(--ink);border:1.5px solid var(--bad)}
.count{font:500 12px/1 var(--f-data);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips i{width:16px;height:10px;border:1.5px solid var(--edge);border-radius:2px;background:var(--panel)}
.pips i.ok{background:var(--good)} .pips i.no{background:var(--bad)} .pips i.now{background:var(--acc)}
.result{display:flex;flex-direction:column;gap:12px}
.result .big{font:700 40px/1 var(--f-display)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.slots li{counter-increment:s;display:flex;gap:10px;align-items:center;padding:8px 12px;border:1.5px dashed var(--rule);border-radius:6px;min-height:42px;color:var(--mute)}
.slots li::before{content:counter(s);font:500 13px var(--f-data);width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--ink);display:grid;place-items:center;flex:none}
.slots li.set{border-style:solid;border-color:var(--good);background:var(--good-bg);color:var(--ink)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool .opt{width:auto}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.field .lab-l{font:500 12px/1.3 var(--f-data);letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.field input[type=number],.field input[type=text],.field input[type=search]{font:500 16px var(--f-data);padding:8px 10px;border:2px solid var(--edge);border-radius:6px;background:var(--panel);color:var(--ink);width:100%;min-width:0}
input[type=range]{width:100%;accent-color:var(--acc-ink)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border:1.5px solid var(--rule);border-radius:6px;padding:10px 12px;background:var(--paper);min-width:0}
.stat b{display:block;font:500 20px/1.2 var(--f-data);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font:500 11px/1.3 var(--f-data);letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.stat.good{border-color:var(--good);background:var(--good-bg)} .stat.bad{border-color:var(--bad);background:var(--bad-bg)}
.verdict{font-size:16px;padding:12px 14px;background:var(--soft);border-radius:6px;max-width:70ch}
.bar{height:14px;border:1.5px solid var(--edge);border-radius:3px;background:var(--paper);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.barrow{display:grid;grid-template-columns:minmax(70px,120px) 1fr 64px;gap:10px;align-items:center;font-size:14px}
.barrow .v{font-family:var(--f-data);text-align:right}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:28px;height:28px;border:2px solid var(--edge);border-radius:5px;background:var(--panel);font:700 16px/1 var(--f-data);padding:0}
.stepper output{font:500 15px var(--f-data);min-width:22px;text-align:center}
.svgwrap{overflow-x:auto;border:1.5px solid var(--rule);border-radius:6px;background:var(--paper)}
.svgwrap svg{display:block;font-family:var(--f-data);margin:0 auto}
.hot{cursor:pointer}
.grid2x2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:2px solid var(--edge);border-radius:6px;overflow:hidden}
.grid2x2>div{padding:12px;display:flex;flex-direction:column;gap:4px;font-size:14px;border:1px solid var(--rule);min-width:0}
.grid2x2 b{font:500 11px/1.3 var(--f-data);letter-spacing:.05em;text-transform:uppercase;color:var(--acc-ink)}

/* home */
.hero{display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:clamp(34px,6vw,56px)}
.case{border:2px solid var(--edge);border-radius:8px;background:var(--panel);box-shadow:5px 5px 0 var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{width:44px;height:44px;border-radius:50%;border:2px dashed var(--rule);display:grid;place-items:center;font-size:22px;color:var(--rule);background:var(--paper)}
.badge.on{border:2px solid var(--edge);background:var(--c);color:var(--on-acc)}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.zone{display:flex;flex-direction:column;gap:8px;text-align:left;padding:14px;border:2px solid var(--edge);border-radius:8px;background:var(--panel);box-shadow:4px 4px 0 var(--shadow);transition:transform .08s,box-shadow .08s;min-width:0}
.zone:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--shadow)}
.zone .top{display:flex;align-items:center;gap:10px}
.zone .tile{width:40px;height:40px;border-radius:6px;background:var(--c);color:var(--on-acc);display:grid;place-items:center;font-size:24px;border:1.5px solid var(--edge);flex:none}
.zone h3{font-size:20px}
.zone .wk{font:500 11px/1.3 var(--f-data);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.zone p{font-size:15px;line-height:1.4}
.zone .st{margin-top:auto;font:500 12px var(--f-data);color:var(--mute)}
.zone .st.on{color:var(--good)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;list-style:none;margin:0;padding:0}
.steps li{display:flex;flex-direction:column;gap:2px;font-size:15px;line-height:1.4}
.steps b{font-family:var(--f-display);font-weight:500;font-size:17px}

/* dex */
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.term{border:1.5px solid var(--rule);border-radius:8px;background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.term h4{font-family:var(--f-body);font-size:16px;font-weight:700;display:flex;gap:8px;align-items:center}
.term h4 i{width:18px;height:18px;border-radius:4px;background:var(--c);color:var(--on-acc);display:grid;place-items:center;font-size:12px;flex:none;border:1px solid var(--edge)}
.term p{font-size:15px;line-height:1.45}
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:28px 20px;border:2px solid var(--edge);border-radius:8px;background:var(--panel);box-shadow:5px 5px 0 var(--shadow);cursor:pointer;width:100%}
.flash .t{font:700 28px/1.15 var(--f-display);text-wrap:balance}
.flash .d{font-size:17px;max-width:52ch;line-height:1.5}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:16px;padding-block:0 56px}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);max-height:none;overflow:visible;padding:10px 0 8px;margin-inline:-16px;padding-inline:16px;border-bottom:1.5px solid var(--rule);gap:8px;transition:background-color .35s ease}
  .brand{flex-direction:row;align-items:baseline;gap:10px;font-size:17px}
  .party{flex-direction:row;overflow-x:auto;gap:6px;padding:2px 2px 4px;scrollbar-width:none}
  .party::-webkit-scrollbar{display:none}
  .party .sep{width:1px;height:auto;margin:0 2px;flex:none}
  .pk{width:auto;flex:none;padding:5px 8px 5px 5px;gap:7px}
  .pk .nm span,.pk .got{display:none}
  .pk .nm b{font-size:14px}
  .pk .tile{width:26px;height:26px;font-size:15px}
  .zone-head{gap:14px}
  .zone-head .tile{width:58px;height:58px;font-size:32px;box-shadow:3px 3px 0 var(--shadow)}
  .cols2{grid-template-columns:minmax(0,1fr)}
  .lead{font-size:17px}
  .barrow{grid-template-columns:minmax(56px,84px) 1fr 58px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div class="app">
  <div class="side">
    <div class="brand">Eeveelution Study Board<small>INFS2040 · Weeks 5 to 9</small></div>
    <nav class="party" id="nav" aria-label="Zones"></nav>
  </div>
  <main id="main" tabindex="-1"></main>
</div>
<script>
const MODS = [], GLOSS = [], FINAL = [];
/* ---------- FLAREON: Week 5 Part A, Cost Management ---------- */
MODS.push({
  id: 'flareon', name: 'Flareon', type: 'fire', typeLabel: 'Fire', week: 'Week 5, Part A',
  title: 'Cost Management', badge: 'Ember Badge', stone: 'Fire Stone',
  hook: 'Flareon runs on an internal flame sac. Feed it well and it hits hard. Let it burn fuel with nobody watching the gauge and you end up with a scorched project. In this zone, the budget is the fuel and you are the trainer watching the flame.',
  concepts: [

/* ---------- ESPEON: Week 8, Gamification and Behavioural Economics ---------- */
MODS.push({
  id: 'espeon', name: 'Espeon', type: 'psychic', typeLabel: 'Psychic', week: 'Week 8',
  title: 'Gamification and Behavioural Economics', badge: 'Dawn Badge', stone: 'High friendship in daylight',
  hook: 'Espeon reads the tiny shifts in the air and knows what you will do before you do it. Behavioural economics is the same trick without the psychic powers: study what people actually do, which is rarely what a rational model says they should, and design for that. Gamification is one of the most useful ways to apply it. This board is doing it to you right now with badges and a progress case.',
  concepts: [
    {
      h: 'What gamification is',
      tag: 'Definition',
      eevee: 'Take the things that make training Pokémon addictive, the levels, the badges, the next evolution just out of reach, and put them somewhere that is not a game. Like a study guide.',
      real: `<p><strong>Gamification:</strong> the use of game elements and game design techniques in non-game contexts.</p><ul><li><strong>Game elements:</strong> the toolbox. The design patterns that make up a game: levels, points, quests or tasks for reward, avatars, a social graph, resource collection.</li><li><strong>Game design techniques:</strong> how we structure the game, especially building a sense of advancement, and fun.</li><li><strong>Non-game context:</strong> modifying behaviour for some targeted good. There is an objective other than success in the game alone.</li></ul><p>Examples from the lecture: Empires and Allies, and exercise apps that use levels, progression, points, rewards, badges, quests and a social graph.</p>`
    },
    {
      h: 'MDA: Mechanics, Dynamics, Aesthetics',
      tag: 'High yield',
      eevee: 'Mechanics are the rules written on the move card: 90 power, 100 accuracy. Dynamics are what happens when two real trainers start using those moves against each other. Aesthetics are the feeling you get when the hit lands.',
      real: `<p class="formula">Rules &gt; System &gt; Fun &nbsp; = &nbsp; Mechanics &gt; Dynamics &gt; Aesthetics</p><ul><li><strong>Mechanics:</strong> the particular components of the game, at the level of data representation and algorithms.</li><li><strong>Dynamics:</strong> the run-time behaviour of the mechanics acting on player inputs (and others) over time.</li><li><strong>Aesthetics:</strong> the desirable emotional responses evoked in the player when they interact with the game.</li></ul><p>It is more than throwing up a badge.</p>`
    },
    {
      h: 'What is winning?',
      eevee: 'Nobody pays you for a full Pokédex. You fill it anyway.',
      real: `<p>Winning does not have to be about money. In a good gamification system, people will collect virtual items with no observable purpose and no tangible reward or real benefit, and still get a sense of achievement and accomplishment from the process.</p>`
    },
    {
      h: 'PBL: Points, Badges, Leaderboards',
      tag: 'High yield',
      eevee: 'Experience points tell you how you are going. Gym badges show the world what you have done. The league table is exciting when you are near the top and crushing when you are rank 9,000.',
      real: `<p>Almost all gamification approaches rely on these three, but they are only part of gamification.</p><ul><li><strong>Points:</strong> a way of keeping score, determining states or defining winning. They give feedback, and they give data to the game designers.</li><li><strong>Badges:</strong> achievements. They reward whatever behaviour the designer wants to motivate, their design communicates, they signal importance (credential or social status), and people like collecting things.</li><li><strong>Leaderboards:</strong> feedback on competition. But they can <strong>demotivate</strong> if your score is very low with no chance of getting on the board, so personalise them or make a local community version.</li></ul><p>"We don't just do things for reward."</p>`

    {
      h: 'Engagement loops and progression',
      eevee: 'Want the badge, battle the gym, see the result, want the next badge. And between gyms there is always a quiet route to catch your breath before the next climb.',

    },
    {
      h: 'Behavioural economics',

const qaHTML = (x) => `<details class="qa"><summary><span class="q">${x.q}</span><span class="mk">${x.marks} marks</span></summary><div class="a"><span class="lbl">Model answer</span><p>${x.a}</p></div></details>`;

/* ================= quiz engine ================= */
function mountQuiz(root, questions, opts) {
  let qs, i, score, marks, missed;
  const start = () => { qs = shuffle(questions).map((q) => ({ ...q, opts: shuffle(q.o.map((t, k) => ({ t, ok: k === 0 }))) })); i = 0; score = 0; marks = []; missed = []; draw(); };
  const pips = () => `<div class="pips" aria-hidden="true">${qs.map((_, k) => `<i class="${marks[k] === true ? 'ok' : marks[k] === false ? 'no' : k === i ? 'now' : ''}"></i>`).join('')}</div>`;
  const draw = () => {
    if (i >= qs.length) {
      root.innerHTML = `<div class="result">${pips()}${opts.done(score, qs.length, root, missed)}${missed.length ? `<h4 class="h3">Review what you missed</h4>${missed.map((m) => `<div class="box"><p><strong>${m.q}</strong></p><p>Answer: ${m.o[0]}</p><p class="note">${m.why}</p></div>`).join('')}` : ''}<div class="row"><button class="btn ghost" data-again>Try again</button></div></div>`;
      $('[data-again]', root).addEventListener('click', start);
      return;
    }
    const q = qs[i];
    root.innerHTML = `<div class="row" style="justify-content:space-between"><span class="count">Question ${i + 1} of ${qs.length}${opts.label ? ' · ' + opts.label(q) : ''}</span><span class="count">Score ${score}</span></div>${pips()}<p class="prompt">${q.q}</p><div class="opts">${q.opts.map((o, k) => `<button class="opt" data-k="${k}">${o.t}</button>`).join('')}</div><div aria-live="polite" id="qfb"></div>`;
    $$('.opt', root).forEach((b) => b.addEventListener('click', () => {
      const pick = q.opts[+b.dataset.k];
      $$('.opt', root).forEach((x, k) => { x.disabled = true; if (q.opts[k].ok) x.classList.add('right'); });
      if (pick.ok) { score++; marks[i] = true; } else { b.classList.add('wrong'); marks[i] = false; missed.push(q); }
      $('#qfb', root).innerHTML = `<div class="fb ${pick.ok ? 'ok' : 'no'}"><strong>${pick.ok ? 'Super effective.' : 'Not very effective.'}</strong> ${q.why}</div><div class="row" style="margin-top:12px"><button class="btn" id="qnext">${i + 1 < qs.length ? 'Next question' : 'See result'}</button></div>`;
      const n = $('#qnext', root); n.addEventListener('click', () => { i++; draw(); }); n.focus();
    }));
  };
  start();
}

/* ================= generic labs ================= */
function mountClassify(root, cfg) {
  let items, i, score;
  const start = () => { items = shuffle(cfg.items); i = 0; score = 0; draw(); };
  const draw = () => {
    if (i >= items.length) {
      root.innerHTML = `<div class="result"><p class="big">${score} / ${items.length}</p><p class="verdict">${score === items.length ? 'Clean sweep.' : score >= items.length * 0.7 ? 'Solid. One more run should lock it in.' : 'Worth another run. The explanations are the bit to read.'}</p>${cfg.after || ''}<div class="row"><button class="btn ghost" data-again>Go again</button></div></div>`;
      $('[data-again]', root).addEventListener('click', start);
      return;
    }
    const it = items[i];
    root.innerHTML = `<div class="row" style="justify-content:space-between"><span class="count">${i + 1} of ${items.length}</span><span class="count">Score ${score}</span></div><p class="prompt">${it.t}</p><div class="cats">${cfg.cats.map((c, k) => `<button class="opt" data-k="${k}">${c}</button>`).join('')}</div><div aria-live="polite" class="cfb"></div>`;
    $$('.opt', root).forEach((b) => b.addEventListener('click', () => {
      const k = +b.dataset.k; const ok = k === it.a;
      $$('.opt', root).forEach((x, j) => { x.disabled = true; if (j === it.a) x.classList.add('right'); });
      if (ok) score++; else b.classList.add('wrong');
      $('.cfb', root).innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><strong>${ok ? 'Yes.' : 'It is ' + cfg.cats[it.a] + '.'}</strong> ${it.why}</div><div class="row" style="margin-top:12px"><button class="btn sm" data-next>${i + 1 < items.length ? 'Next' : 'Finish'}</button></div>`;
      const n = $('[data-next]', root); n.addEventListener('click', () => { i++; draw(); }); n.focus();
    }));
  };
  start();
}
function mountOrder(root, cfg) {
  let pool, placed, misses;
  const start = () => { pool = shuffle(cfg.items); placed = 0; misses = 0; draw(); };
  const draw = (msg) => {
    const done = placed === cfg.items.length;
    root.innerHTML = `<ol class="slots">${cfg.items.map((t, k) => `<li class="${k < placed ? 'set' : ''}">${k < placed ? t : k === placed ? 'Which comes next?' : ''}</li>`).join('')}</ol>
    ${done ? `<p class="verdict">${misses === 0 ? 'Perfect run, no wrong taps.' : 'Done, with ' + misses + ' wrong ' + (misses === 1 ? 'tap' : 'taps') + ' along the way.'}</p><div class="row"><button class="btn ghost" data-again>Shuffle and retry</button></div>` : `<div class="pool">${pool.map((t) => `<button class="opt" data-t="${encodeURIComponent(t)}">${t}</button>`).join('')}</div><p class="count" aria-live="polite">${msg || 'Wrong taps: ' + misses}</p>`}`;
    if (done) { $('[data-again]', root).addEventListener('click', start); return; }
    $$('.pool .opt', root).forEach((b) => b.addEventListener('click', () => {
      const t = decodeURIComponent(b.dataset.t);
      if (t === cfg.items[placed]) { placed++; pool = pool.filter((x) => x !== t); draw(); }
      else { misses++; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake', 'wrong'); $('.count', root).textContent = 'Not yet. Wrong taps: ' + misses; }
    }));
  };
  start();
}

/* ---- Vaporeon: NPV ---- */
LABS.npv = (root) => {
  const P = [
    { n: 'Flame', sub: '$500k system, one operator', b: [0, 200, 300, 400, 500], c: [500, 100, 100, 100, 100] },
    { n: 'Flint', sub: '$100k system, two operators', b: [100, 200, 400, 400, 400], c: [200, 200, 200, 200, 200] }
  ];
  root.innerHTML = `<div class="field"><label for="npv-r">Discount rate: <output id="npv-ro"></output></label><input type="range" id="npv-r" min="0" max="30" step="1" value="10"></div><div id="npv-out" class="stack"></div>`;
  const draw = () => {
    const r = +$('#npv-r', root).value / 100;
    $('#npv-ro', root).textContent = Math.round(r * 100) + '%';
    const res = P.map((p) => {
      const net = p.b.map((b, i) => b - p.c[i]);
      const f = net.map((_, i) => 1 / Math.pow(1 + r, i));
      const d = net.map((x, i) => x * f[i]);
      const npv = d.reduce((s, x) => s + x, 0);
      const B = p.b.reduce((s, x) => s + x, 0), C = p.c.reduce((s, x) => s + x, 0);
      let cum = 0, pay = null; net.forEach((x, i) => { cum += x; if (pay === null && cum > 0) pay = i + 1; });
      return { ...p, net, f, d, npv, roi: (B - C) / C, pay };
    });
    const max = Math.max(...res.map((x) => Math.abs(x.npv)), 1);
    const lead = res[0].npv === res[1].npv ? null : res[0].npv > res[1].npv ? res[0] : res[1];
    $('#npv-out', root).innerHTML = res.map((x) => `<div class="stack" style="gap:8px"><h4 class="h3">${x.n} <span class="note">${x.sub}</span></h4><div class="scroll"><table class="tbl"><thead><tr><th>$k</th>${x.net.map((_, i) => `<th class="num">P${i + 1}</th>`).join('')}</tr></thead><tbody><tr><td>Net cash flow</td>${x.net.map((v) => `<td class="num">${v}</td>`).join('')}</tr><tr><td>Discount factor</td>${x.f.map((v) => `<td class="num">${v.toFixed(3)}</td>`).join('')}</tr><tr class="total"><td>Discounted</td>${x.d.map((v) => `<td class="num">${v.toFixed(1)}</td>`).join('')}</tr></tbody></table></div><div class="stats"><div class="stat"><span>NPV</span><b>$${x.npv.toFixed(1)}k</b></div><div class="stat"><span>ROI</span><b>${(x.roi * 100).toFixed(1)}%</b></div><div class="stat"><span>Pays back in</span><b>Period ${x.pay}</b></div></div></div>`).join('') +
      `<div class="stack" style="gap:6px">${res.map((x) => `<div class="barrow"><span>${x.n} NPV</span><div class="bar"><i style="width:${Math.max(0, x.npv) / max * 100}%;background:var(--acc)"></i></div><span class="v">$${x.npv.toFixed(0)}k</span></div>`).join('')}</div>
      <p class="verdict">${lead ? `At ${Math.round(r * 100)}%, ${lead.n} leads on NPV by $${Math.abs(res[0].npv - res[1].npv).toFixed(1)}k. Flame still has the higher ROI at every rate, because ROI ignores timing.` : 'At 0% it is a tie: both total $500k. Raise the rate and Flame falls faster, because its money arrives later.'}${Math.round(r * 100) === 10 ? ' The lecture rounds the factors to three decimals and gets about $254,500 and $352,000.' : ''}</p>`;
  };
  $('#npv-r', root).addEventListener('input', draw);
  draw();
};

/* ---- Leafeon: critical path ---- */
LABS.cpm = (root) => {
  const N = { S: [36, 140, 'Start'], A: [128, 140, 'A'], B: [240, 50, 'B'], C: [240, 140, 'C'], D: [240, 230, 'D'], E: [360, 95, 'E'], F: [452, 205, 'F'], G: [536, 140, 'G'], Z: [612, 140, 'End'] };
  const BASE = [['S', 'A', 2, 'Rose: spec'], ['A', 'B', 2, 'Paul'], ['A', 'C', 3, 'Paul'], ['A', 'D', 4, 'Paul'], ['B', 'E', 2, 'Lisa'], ['C', 'E', 3, 'Lisa'], ['D', 'F', 6, 'Ben'], ['E', 'F', 5, 'Lisa'], ['E', 'G', 2, 'Paul'], ['F', 'G', 1, 'Green team: UX'], ['G', 'Z', 2, 'Rose: documentation']];
  let E = BASE.map((e) => [...e]);
  const solve = () => {
    const es = {}, lf = {}; Object.keys(N).forEach((k) => { es[k] = 0; });
    E.forEach(([u, v, d]) => { es[v] = Math.max(es[v], es[u] + d); });
    Object.keys(N).forEach((k) => { lf[k] = es.Z; });
    [...E].reverse().forEach(([u, v, d]) => { lf[u] = Math.min(lf[u], lf[v] - d); });
    return { len: es.Z, slack: E.map(([u, v, d]) => lf[v] - es[u] - d) };
  };
  const draw = () => {
    const { len, slack } = solve();
    const path = ['S']; let cur = 'S', guard = 0;
    while (cur !== 'Z' && guard++ < 20) { const k = E.findIndex((e, i) => e[0] === cur && slack[i] === 0); if (k < 0) break; cur = E[k][1]; path.push(cur); }
    const svg = `<svg viewBox="0 0 648 280" width="648" height="280" role="img" aria-label="Network diagram. Critical path: ${path.map((k) => N[k][2]).join(', ')}. Length ${len}.">
      ${E.map(([u, v, d], i) => { const [x1, y1] = N[u], [x2, y2] = N[v]; const crit = slack[i] === 0; const mx = (x1 + x2) / 2, my = (y1 + y2) / 2; return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${crit ? 'var(--acc-ink)' : 'var(--rule)'}" stroke-width="${crit ? 5 : 2.500}"/><rect x="${mx - 11}" y="${my - 11}" width="22" height="22" rx="4" fill="${crit ? 'var(--acc)' : 'var(--panel)'}" stroke="var(--edge)" stroke-width="1.500"/><text x="${mx}" y="${my + 4.500}" text-anchor="middle" font-size="13" font-weight="500" fill="${crit ? 'var(--on-acc)' : 'var(--ink)'}">${d}</text>`; }).join('')}
      ${Object.entries(N).map(([k, [x, y, l]]) => `<circle cx="${x}" cy="${y}" r="${l.length > 1 ? 22 : 17}" fill="${path.includes(k) ? 'var(--soft)' : 'var(--panel)'}" stroke="var(--edge)" stroke-width="2"/><text x="${x}" y="${y + 5}" text-anchor="middle" font-size="${l.length > 1 ? 12 : 15}" font-weight="500" fill="var(--ink)">${l}</text>`).join('')}
    </svg>`;
    root.innerHTML = `<div class="stats"><div class="stat"><span>Project length</span><b>${len} months</b></div><div class="stat" style="grid-column:span 2"><span>Critical path</span><b style="font-size:16px">${path.map((k) => N[k][2]).join(' → ')}</b></div></div>
    <div class="svgwrap">${svg}</div>
    <div class="scroll"><table class="tbl"><thead><tr><th>Activity</th><th>Who</th><th>Duration</th><th class="num">Slack</th></tr></thead><tbody>${E.map(([u, v, d, who], i) => `<tr><td>${N[u][2]} to ${N[v][2]}</td><td>${who}</td><td><span class="stepper"><button data-i="${i}" data-d="-1" aria-label="Shorten ${N[u][2]} to ${N[v][2]}">−</button><output>${d}</output><button data-i="${i}" data-d="1" aria-label="Lengthen ${N[u][2]} to ${N[v][2]}">+</button></span></td><td class="num">${slack[i] === 0 ? '<strong>0 (critical)</strong>' : slack[i]}</td></tr>`).join('')}</tbody></table></div>
    <div class="row"><button class="btn sm ghost" data-reset>Reset to the lecture numbers</button></div>
    <p class="note">Try it: add 1 to D to F and nothing moves, because Ben has exactly 1 month of slack. Add 2 and the critical path jumps to his branch. Double E to G from 2 to 4 and the end date still holds.</p>`;
    $$('.stepper button', root).forEach((b) => b.addEventListener('click', () => { const i = +b.dataset.i; E[i][2] = Math.max(1, Math.min(12, E[i][2] + +b.dataset.d)); draw(); }));
    $('[data-reset]', root).addEventListener('click', () => { E = BASE.map((e) => [...e]); draw(); });
  };
  draw();
};

  const pick = (k) => { $('#g-cap', root).innerHTML = `<strong>${INFO[k][0]}.</strong> ${INFO[k][1]}`; $$('button.chip', root).forEach((c) => c.setAttribute('aria-pressed', c.dataset.k === k)); $$('.hot', root).forEach((g) => { g.style.opacity = g.dataset.k === k ? 1 : 0.35; }); };

/* ---- Glaceon: EVM calculator ---- */
function evm(pv, rp, ac, bac) {
  const ev = pv * rp / 100, cv = ev - ac, sv = ev - pv, cpi = ac ? ev / ac : NaN, spi = pv ? ev / pv : NaN;
  const eac = bac && cpi ? bac / cpi : null;
  return { ev, cv, sv, cpi, spi, eac, etc: eac != null ? eac - ac : null };
}
LABS.evm = (root) => {
  const PRE = { 'Website, week 10': [100000, 80, 75000, 300000], 'Gamma Project': [120000, 70, 100000, ''], 'Week 8 example': [120000, 66.67, 60000, 160000], 'Team Orion': [90000, 70, 75000, 150000] };
  root.innerHTML = `<div class="row">${Object.keys(PRE).map((k) => `<button class="btn sm ghost" data-pre="${k}">${k}</button>`).join('')}</div>
  <div class="fields"><div class="field"><label for="e-pv">PV to date ($)</label><input type="number" id="e-pv" min="0" step="1000"></div><div class="field"><label for="e-rp">RP (%)</label><input type="number" id="e-rp" min="0" step="1"></div><div class="field"><label for="e-ac">AC ($)</label><input type="number" id="e-ac" min="0" step="1000"></div><div class="field"><label for="e-bac">BAC ($, optional)</label><input type="number" id="e-bac" min="0" step="1000"></div></div>
  <div class="stats" id="e-out"></div><p class="verdict" id="e-v" aria-live="polite"></p>`;
  const set = (a) => { ['pv', 'rp', 'ac', 'bac'].forEach((k, i) => { $('#e-' + k, root).value = a[i]; }); draw(); };
  const draw = () => {
    const pv = +$('#e-pv', root).value || 0, rp = +$('#e-rp', root).value || 0, ac = +$('#e-ac', root).value || 0, bac = +$('#e-bac', root).value || 0;
    const r = evm(pv, rp, ac, bac);
    const st = (label, val, cls) => `<div class="stat ${cls || ''}"><span>${label}</span><b>${val}</b></div>`;
    const idx = (x) => (isFinite(x) ? x.toFixed(2) : 'n/a');
    $('#e-out', root).innerHTML = st('EV = PV × RP', money(r.ev)) + st('CV = EV − AC', signed(r.cv), r.cv < 0 ? 'bad' : 'good') + st('SV = EV − PV', signed(r.sv), r.sv < 0 ? 'bad' : 'good') + st('CPI = EV / AC', idx(r.cpi), r.cpi < 1 ? 'bad' : 'good') + st('SPI = EV / PV', idx(r.spi), r.spi < 1 ? 'bad' : 'good') + (r.eac != null && isFinite(r.eac) ? st('EAC = BAC / CPI', money(r.eac), r.eac > bac ? 'bad' : 'good') + st('ETC = EAC − AC', money(r.etc)) : '');
    const cost = r.cv > 0 ? `under budget by ${money(r.cv)}` : r.cv < 0 ? `over budget by ${money(-r.cv)}` : 'exactly on budget';
    const sched = r.sv > 0 ? `ahead of schedule by ${money(r.sv)} of work` : r.sv < 0 ? `behind schedule by ${money(-r.sv)} of work` : 'exactly on schedule';
    $('#e-v', root).innerHTML = `<strong>Sponsor sentence:</strong> at this point in time we are ${cost} and ${sched}.${r.eac != null && isFinite(r.eac) ? ` If performance holds, we finish at about ${money(r.eac)} against a budget of ${money(bac)}.` : ''} The numbers say what is happening. Finding out why is still your job.`;
  };
  $$('input', root).forEach((i) => i.addEventListener('input', draw));
  $$('[data-pre]', root).forEach((b) => b.addEventListener('click', () => set(PRE[b.dataset.pre])));
  set(PRE['Website, week 10']);
};

/* ---- Glaceon: drill ---- */
LABS.evmdrill = (root) => {
  let q;
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const parse = (s) => { const t = String(s).replace(/[$,\s]/g, '').replace(/[−–]/g, '-').replace(/k$/i, '000'); return t === '' ? NaN : Number(t); };
  const fresh = () => {
    const pv = pick([60, 80, 100, 120, 150, 180, 200, 240, 300]) * 1000;
    const rp = pick([50, 60, 70, 75, 80, 90, 100, 110, 120, 125]);
    const ac = Math.round(pv * pick([0.6, 0.7, 0.75, 0.8, 0.9, 1, 1.1]) / 5000) * 5000;
    q = { pv, rp, ac, ...evm(pv, rp, ac) };
    root.innerHTML = `<div class="stats"><div class="stat"><span>PV to date</span><b>${money(pv)}</b></div><div class="stat"><span>RP</span><b>${rp}%</b></div><div class="stat"><span>AC</span><b>${money(ac)}</b></div></div>
    <form id="d-form" class="stack" style="gap:12px"><div class="fields"><div class="field"><label for="d-ev">Earned value</label><input type="text" id="d-ev" inputmode="text" autocomplete="off" placeholder="e.g. 84000"></div><div class="field"><label for="d-cv">Cost variance</label><input type="text" id="d-cv" inputmode="text" autocomplete="off" placeholder="e.g. -16000"></div><div class="field"><label for="d-sv">Schedule variance</label><input type="text" id="d-sv" inputmode="text" autocomplete="off" placeholder="e.g. -16000"></div></div>
    <div class="row"><button class="btn" type="submit">Check</button><button class="btn ghost" type="button" id="d-new">New numbers</button></div></form><div id="d-out" aria-live="polite" class="stack" style="gap:8px"></div>`;
    $('#d-new', root).addEventListener('click', fresh);
    $('#d-form', root).addEventListener('submit', (e) => {
      e.preventDefault();
      const ans = { ev: parse($('#d-ev', root).value), cv: parse($('#d-cv', root).value), sv: parse($('#d-sv', root).value) };
      const ok = (k) => Math.abs(ans[k] - q[k]) < 1;
      const line = (k, label, work) => `<div class="fb ${ok(k) ? 'ok' : 'no'}"><strong>${label}: ${ok(k) ? 'correct' : 'not quite'}.</strong> ${work}</div>`;
      const all = ok('ev') && ok('cv') && ok('sv');
      $('#d-out', root).innerHTML = line('ev', 'EV', `${money(q.pv)} × ${q.rp / 100} = ${money(q.ev)}`) + line('cv', 'CV', `${money(q.ev)} − ${money(q.ac)} = ${signed(q.cv)}`) + line('sv', 'SV', `${money(q.ev)} − ${money(q.pv)} = ${signed(q.sv)}`) + `<p class="verdict">${all ? 'All three. ' : ''}CPI is ${q.cpi.toFixed(2)} and SPI is ${q.spi.toFixed(2)}, so this project is ${q.cv > 0 ? 'under budget' : q.cv < 0 ? 'over budget' : 'on budget'} and ${q.sv > 0 ? 'ahead of schedule' : q.sv < 0 ? 'behind schedule' : 'on schedule'}.</p>`;
    });
  };
  fresh();
};

/* ---- Umbreon: health radar ---- */
LABS.radar = (root) => {
  const D = [
    ['Clarity of goals', 'Ask the product owner to restate the sprint goal and the top three priorities.'],
    ['Collaboration', 'Bring developers and QA together earlier, for example a mid-sprint hand-off instead of one at the end.'],
    ['Psychological safety', 'Run a blameless retrospective. Stand-ups ask questions, they do not hand out verdicts.'],
    ['Efficiency', 'Set a work-in-progress limit so stories are finished before new ones are started.'],
    ['Quality', 'Protect testing time and agree what "done" means before the sprint starts.'],
    ['Energy and morale', 'Commit to fewer points next sprint and check the pace is sustainable.']
  ];
  const ORION = [3, 2, 4, 2, 3, 2];
  const WHY = ['Stand-ups are "short but not very useful" and commitments keep rising.', 'QA feels rushed because Development hands off too late.', 'People are raising problems openly in the retrospective, which is a good sign.', 'WIP 8 to 13, cycle time 3.8 to 5.1 days, CPI 0.84.', 'Defects rose from 4 to 7, though the team is proud of its work.', '"Morale\'s dipping" and the pace "is not sustainable".'];
  let v = [3, 3, 3, 3, 3, 3], orion = false;
  root.innerHTML = `<div class="row"><button class="btn sm ghost" id="r-orion">Load my reading of Team Orion</button><button class="btn sm ghost" id="r-reset">Reset to 3s</button></div>
  <div class="cols2"><div class="svgwrap" id="r-svg" style="border:none;background:none"></div><div class="stack" style="gap:10px">${D.map((d, i) => `<div class="field"><label for="r-${i}">${d[0]}: <output id="ro-${i}"></output></label><input type="range" id="r-${i}" data-i="${i}" min="1" max="5" step="1"><span class="note" id="rw-${i}"></span></div>`).join('')}</div></div>
  <p class="verdict" id="r-v" aria-live="polite"></p><p class="note">The Orion scores are one reasonable reading of the slide data, with the evidence shown under each slider. The slides leave the rating to class discussion, so yours can differ as long as you can back it with evidence.</p>`;
  const draw = () => {
    const cx = 210, cy = 150, R = 92;
    const pt = (i, val) => { const a = -Math.PI / 2 + i * Math.PI / 3; return [cx + Math.cos(a) * R * val / 5, cy + Math.sin(a) * R * val / 5]; };
    const ring = (val) => D.map((_, i) => pt(i, val).map((n) => n.toFixed(1)).join(',')).join(' ');
    $('#r-svg', root).innerHTML = `<svg viewBox="0 0 420 300" width="420" height="300" style="max-width:100%;height:auto" role="img" aria-label="Health radar. ${D.map((d, i) => d[0] + ' ' + v[i]).join(', ')}.">
      ${[1, 2, 3, 4, 5].map((k) => `<polygon points="${ring(k)}" fill="none" stroke="var(--rule)" stroke-width="${k === 5 ? 1.500 : 1}"/>`).join('')}
      ${D.map((_, i) => { const [x, y] = pt(i, 5); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--rule)" stroke-width="1"/>`; }).join('')}
      <polygon points="${D.map((_, i) => pt(i, v[i]).map((n) => n.toFixed(1)).join(',')).join(' ')}" fill="var(--acc)" fill-opacity="0.45" stroke="var(--acc-ink)" stroke-width="2.500" stroke-linejoin="round"/>
      ${D.map((_, i) => { const [x, y] = pt(i, v[i]); return `<circle cx="${x}" cy="${y}" r="4" fill="var(--acc-ink)"/>`; }).join('')}
      ${D.map((d, i) => { const [x, y] = pt(i, 6.1); const words = d[0].split(' '); const two = words.length > 1 && i !== 0 && i !== 3; return `<text x="${x}" y="${y + (i === 0 ? -2 : i === 3 ? 10 : 0)}" text-anchor="${i === 0 || i === 3 ? 'middle' : i < 3 ? 'start' : 'end'}" font-size="11" fill="var(--ink)">${two ? `<tspan x="${x}" dy="0">${words[0]}</tspan><tspan x="${x}" dy="13">${words.slice(1).join(' ')}</tspan>` : d[0]}</text>`; }).join('')}
    </svg>`;
    v.forEach((x, i) => { $('#r-' + i, root).value = x; $('#ro-' + i, root).textContent = x + ' / 5'; $('#rw-' + i, root).textContent = orion ? WHY[i] : ''; });
    const avg = v.reduce((s, x) => s + x, 0) / 6, min = Math.min(...v);
    const low = v.map((x, i) => (x === min ? i : -1)).filter((i) => i >= 0);
    $('#r-v', root).innerHTML = low.length === 6 && min < 4 ? `<strong>Average ${avg.toFixed(1)} of 5.</strong> Every ring sits at ${min}. Move the sliders until the shape matches the evidence you have about the team.` : min >= 4 ? `<strong>Average ${avg.toFixed(1)} of 5.</strong> Every ring is glowing evenly. Keep doing what you are doing, and keep checking.` : `<strong>Average ${avg.toFixed(1)} of 5.</strong> Dimmest ${low.length > 1 ? 'rings' : 'ring'}: ${low.map((i) => D[i][0].toLowerCase()).join(', ')}. A possible experiment for the next sprint: ${D[low[0]][1]}`;
  };
  $$('input[type=range]', root).forEach((s) => s.addEventListener('input', () => { v[+s.dataset.i] = +s.value; orion = false; draw(); }));
  $('#r-orion', root).addEventListener('click', () => { v = [...ORION]; orion = true; draw(); });
  $('#r-reset', root).addEventListener('click', () => { v = [3, 3, 3, 3, 3, 3]; orion = false; draw(); });
  draw();
};

/* ================= dex ================= */
function renderDex(main) {
  let filter = 'all', query = '', mode = 'list', deck = [], di = 0, flipped = false;
  const sorted = [...GLOSS].sort((a, b) => a.t.localeCompare(b.t));
  main.innerHTML = `<div class="stack-lg"><header class="hero"><p class="eyebrow">Glossary</p><h1>The Dex</h1><p class="lead">Every term from Weeks 5 to 9, tagged by the evolution that teaches it. Search it, filter it, or switch to flashcards and test yourself.</p></header>
  <div class="stack"><div class="field"><label for="dex-q">Search terms and definitions</label><input type="search" id="dex-q" placeholder="Try: reserve, sprint, variance" autocomplete="off"></div>
  <div class="row" id="dex-f"><button class="chip" data-f="all" aria-pressed="true">All</button>${MODS.map((m) => `<button class="chip" data-f="${m.id}" aria-pressed="false">${m.name}</button>`).join('')}</div>
  <div class="row" style="justify-content:space-between"><span class="count" id="dex-n" aria-live="polite"></span><div class="row"><button class="btn sm ghost" id="dex-mode">Switch to flashcards</button></div></div>
  <div id="dex-out"></div></div></div>`;
  const hits = () => sorted.filter((g) => (filter === 'all' || g.m === filter) && (!query || (g.t + ' ' + g.d).toLowerCase().includes(query)));
  const drawCard = () => {
    const out = $('#dex-out', main);
    if (!deck.length) { out.innerHTML = '<p class="verdict">No terms match. Clear the search or pick another type.</p>'; return; }
    const g = deck[di];
    out.innerHTML = `<div class="stack"><button class="flash" id="fl" style="--c:var(--t-${TYPE_OF[g.m]})" aria-label="Flashcard. Tap to flip."><span class="chip">${em(TYPE_OF[g.m])} ${MODS.find((m) => m.id === g.m).name}</span>${flipped ? `<span class="d">${g.d}</span><span class="count">${g.t}</span>` : `<span class="t">${g.t}</span><span class="count">Say the definition out loud, then tap to flip</span>`}</button>
    <div class="row" style="justify-content:space-between"><button class="btn sm ghost" id="fl-prev">Back</button><span class="count">${di + 1} of ${deck.length}</span><div class="row"><button class="btn sm ghost" id="fl-shuf">Shuffle</button><button class="btn sm" id="fl-next">Next</button></div></div></div>`;
    $('#fl', main).addEventListener('click', () => { flipped = !flipped; drawCard(); $('#fl', main).focus(); });
    $('#fl-prev', main).addEventListener('click', () => { di = (di - 1 + deck.length) % deck.length; flipped = false; drawCard(); });
    $('#fl-next', main).addEventListener('click', () => { di = (di + 1) % deck.length; flipped = false; drawCard(); });
    $('#fl-shuf', main).addEventListener('click', () => { deck = shuffle(deck); di = 0; flipped = false; drawCard(); });
  };
  const draw = () => {
    const h = hits();
    $('#dex-n', main).textContent = `${h.length} of ${GLOSS.length} terms`;
    $('#dex-mode', main).textContent = mode === 'list' ? 'Switch to flashcards' : 'Switch to list';
    if (mode === 'list') {
      $('#dex-out', main).innerHTML = h.length ? `<div class="dex">${h.map((g) => `<article class="term" style="--c:var(--t-${TYPE_OF[g.m]})"><h4><i>${em(TYPE_OF[g.m])}</i>${g.t}</h4><p>${g.d}</p></article>`).join('')}</div>` : '<p class="verdict">No terms match. Clear the search or pick another type.</p>';
    } else { deck = shuffle(h); di = 0; flipped = false; drawCard(); }
  };
  $('#dex-q', main).addEventListener('input', (e) => { query = e.target.value.trim().toLowerCase(); draw(); });
  $$('#dex-f .chip', main).forEach((c) => c.addEventListener('click', () => { filter = c.dataset.f; $$('#dex-f .chip', main).forEach((x) => x.setAttribute('aria-pressed', x === c)); draw(); }));
  $('#dex-mode', main).addEventListener('click', () => { mode = mode === 'list' ? 'cards' : 'list'; draw(); });
  draw();
}

/* ================= champion ================= */
function renderChampion(main) {
  main.innerHTML = `<div class="stack-lg"><header class="hero"><p class="eyebrow">The big quiz</p><h1>Champion Challenge</h1><p class="lead">Thirty-two questions you have not seen in the gym quizzes: four from each evolution, shuffled together. Score 26 or more (about 80%) to earn the Champion ribbon.</p><div class="meta"><span class="chip">${badgeCount()} of 8 badges</span>${state.p.f != null ? `<span class="chip">Best so far: ${state.p.f} / 32</span>` : ''}</div></header>
  <section class="lab"><header><h3>All eight types, one battle</h3><p>No time limit. You get the explanation after every answer.</p></header><div class="body" id="champ"><div class="row"><button class="btn" id="champ-go">Start the challenge</button></div></div></section></div>`;
  $('#champ-go', main).addEventListener('click', () => {
    mountQuiz($('#champ', main), FINAL, {
      label: (q) => MODS.find((m) => m.id === q.m).name,
      done: (score, total, root, missed) => {
        state.p.f = Math.max(state.p.f || 0, score); save(); renderNav();
        const pct = score / total;
        const rank = pct >= 0.95 ? 'Master trainer' : pct >= 0.8 ? 'Champion' : pct >= 0.65 ? 'Ace trainer' : pct >= 0.5 ? 'Gym challenger' : 'Rookie trainer';
        const by = MODS.map((m) => ({ m, miss: missed.filter((q) => q.m === m.id).length }));
        const worst = by.filter((x) => x.miss > 0).sort((a, b) => b.miss - a.miss);
        return `<p class="big">${score} / ${total}</p><p class="verdict"><strong>${rank}.</strong> ${pct >= 0.8 ? 'The Champion ribbon is yours.' : 'You need 26 for the ribbon.'} ${worst.length ? `Your weakest ${worst.length > 1 && worst[0].miss === worst[1].miss ? 'zones were' : 'zone was'} ${listAnd(worst.filter((x) => x.miss === worst[0].miss).map((x) => x.m.name))}.` : 'A perfect run.'}</p>
        <div class="stack" style="gap:6px">${by.map((x) => `<div class="barrow"><span>${x.m.name}</span><div class="bar"><i style="width:${(4 - x.miss) / 4 * 100}%;background:var(--t-${x.m.type})"></i></div><span class="v">${4 - x.miss} / 4</span></div>`).join('')}</div>
        ${worst.length ? `<div class="row">${worst.slice(0, 3).map((x) => `<button class="btn sm ghost" data-go="${x.m.id}">Revisit ${x.m.name}</button>`).join('')}</div>` : ''}`;
      }
    });
  });
}
